<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iranian Vehicle Recognition</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <div class="container">

        <h1>🚗 Iranian Vehicle Recognition</h1>

        <p class="subtitle">
            Upload an image and let AI recognize the vehicle.
        </p>

        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button id="predictButton">
                🔍 Recognize Vehicle
            </button>

        </div>

        <div id="previewContainer"></div>

        <div id="loading">
            Analyzing image...
        </div>

        <div id="result"></div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
